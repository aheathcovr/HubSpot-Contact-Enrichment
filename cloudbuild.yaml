steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hubspot-enrichment:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hubspot-enrichment:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/hubspot-enrichment']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hubspot-enrichment'
      - '--image=gcr.io/$PROJECT_ID/hubspot-enrichment:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=4'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--timeout=1800s'
      - '--cpu-boost'
      # HUBSPOT_PORTAL_ID is Covr_HubSpot, the portal the service's own HubSpot token belongs to. The HubSpot app's
      # /app/... requests carry the portal they came from; with this unset a request from any account holding the
      # app's secret would be accepted and its record ids looked up in Covr_HubSpot (test_deploy_config.py checks it).
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BQ_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1,CLOUD_TASKS_QUEUE=hubspot-enrichment,CLOUD_RUN_SERVICE_URL=$_CLOUD_RUN_SERVICE_URL,CLOUD_TASKS_SA_EMAIL=$_CLOUD_TASKS_SA_EMAIL,HUBSPOT_PORTAL_ID=24434722'
      - '--set-secrets=HUBSPOT_API_KEY=HUBSPOT_API_KEY:latest'
      - '--set-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest'
      - '--set-secrets=MILLIONVERIFIER_API_KEY=MILLIONVERIFIER_API_KEY:latest'
      - '--set-secrets=FULLENRICH_API_KEY=FULLENRICH_API_KEY:latest'
      - '--set-secrets=HUBSPOT_WEBHOOK_SECRET=HUBSPOT_WEBHOOK_SECRET:latest'
      # --set-secrets replaces the service's whole list on every deploy, so a vendor key that is
      # only attached by hand is gone after the next merge. Every key the code reads goes here
      # (test_deploy_config.py checks it). Both secrets must exist, and the runtime account must
      # be able to read them (setup_runtime_service_account.sh), or the deploy fails.
      - '--set-secrets=BOUNCEBAN_API_KEY=BOUNCEBAN_API_KEY:latest'
      - '--set-secrets=SEAMLESS_API_KEY=SEAMLESS_API_KEY:latest'
      # The secret the HubSpot app's function signs its requests with. It must exist before this deploys
      # (setup_app_secret.sh makes it and lets the runtime account read it); until it is set every /app request is
      # refused with 503.
      - '--set-secrets=APP_REQUEST_SECRET=APP_REQUEST_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/hubspot-enrichment:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/hubspot-enrichment:latest'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
